ado.<small>C01_puente_pasillo.png · C_UNION_PUENTE_PASILLO</small></figcaption></figure><figure><a href="CAPTURAS/C02_detalle_adaptador.png"><img loading="lazy" src="CAPTURAS/C02_detalle_adaptador.png"></a><figcaption><b>Acceso posterior: adaptador naranja construido solo para laboratorio</b><br>Contexto posterior aislado solo para captura. Paredes/techo del adaptador retranqueados 0.14m; carrera de puertas sin certificar.<small>C02_detalle_adaptador.png · C_UNION_PUENTE_PASILLO</small></figcaption></figure><figure><a href="CAPTURAS/D01_interior_camarote.png"><img loading="lazy" src="CAPTURAS/D01_interior_camarote.png"></a><figcaption><b>Habitación existente con cama, escritorio y armario de referencia</b><br>Envolvente completa; volúmenes verdes nuevos, sin diseño artístico final.<small>D01_interior_camarote.png · D_CAMAROTE_ENSAYO</small></figcaption></figure><figure><a href="CAPTURAS/D02_planta_camarote.png"><img loading="lazy" src="CAPTURAS/D02_planta_camarote.png"></a><figcaption><b>Maqueta de camarote y conexión al pasillo</b><br>Envolvente Group4 / Mesh4, corte Z=2.30 m; mobiliario verde solo para comprobar espacio.<small>D02_planta_camarote.png · D_CAMAROTE_ENSAYO</small></figcaption></figure><figure><a href="CAPTURAS/D03_camarote_perspectiva.png"><img loading="lazy" src="CAPTURAS/D03_camarote_perspectiva.png"></a><figcaption><b>Volumen caminable, entrada y mobiliario de prueba</b><br>Corte Z=2.30 m. Los objetos no son muebles definitivos.<small>D03_camarote_perspectiva.png · D_CAMAROTE_ENSAYO</small></figcaption></figure><figure><a href="CAPTURAS/E01_puertas_cerradas.png"><img loading="lazy" src="CAPTURAS/E01_puertas_cerradas.png"></a><figcaption><b>Tres puertas: 1 / ensayo geométrico</b><br>Las poses intermedias tienen nuevos contactos detectados; apertura final no certifica bolsillos ni mecanismo.<small>E01_puertas_cerradas.png · E_PUERTAS_CARRERA_PRUEBA</small></figcaption></figure><figure><a href="CAPTURAS/E02_puertas_intermedias.png"><img loading="lazy" src="CAPTURAS/E02_puertas_intermedias.png"></a><figcaption><b>Tres puertas: 25 / ensayo geométrico</b><br>Las poses intermedias tienen nuevos contactos detectados; apertura final no certifica bolsillos ni mecanismo.<small>E02_puertas_intermedias.png · E_PUERTAS_CARRERA_PRUEBA</small></figcaption></figure><figure><a href="CAPTURAS/E03_puertas_abiertas.png"><img loading="lazy" src="CAPTURAS/E03_puertas_abiertas.png"></a><figcaption><b>Tres puertas: 49 / ensayo geométrico</b><br>Las poses intermedias tienen nuevos contactos detectados; apertura final no certifica bolsillos ni mecanismo.<small>E03_puertas_abiertas.png · E_PUERTAS_CARRERA_PRUEBA</small></figcaption></figure><figure><a href="CAPTURAS/E04_sillas_grupos.png"><img loading="lazy" src="CAPTURAS/E04_sillas_grupos.png"></a><figcaption><b>Cinco agrupaciones revisadas: 8 / 31 / 31 / 11 / 11 piezas</b><br>Grupos semánticos corregidos; los giros históricos corresponden a agrupaciones anteriores. Articulación y sentado sin validar.<small>E04_sillas_grupos.png · E_SILLAS_GRUPOS</small></figcaption></figure><figure><a href="CAPTURAS/G01_conjunto_completo.png"><img loading="lazy" src="CAPTURAS/G01_conjunto_completo.png"></a><figcaption><b>Conjunto experimental completo, sin cortes</b><br><small>G01_conjunto_completo.png · G_INTERIORES_CONECTADOS</small></figcaption></figure><figure><a href="CAPTURAS/G02_conjunto_planta.png"><img loading="lazy" src="CAPTURAS/G02_conjunto_planta.png"></a><figcaption><b>Puente + pasillos + turbolift + camarote</b><br>Corte Z=2.30 m; rojo/naranja: adaptadores de prueba. No valida el tránsito de todo el puente.<small>G02_conjunto_planta.png · G_INTERIORES_CONECTADOS</small></figcaption></figure><figure><a href="CAPTURAS/G03_conjunto_perspectiva.png"><img loading="lazy" src="CAPTURAS/G03_conjunto_perspectiva.png"></a><figcaption><b>Conexiones de laboratorio verificadas en recorridos seleccionados</b><br>Corte Z=2.30 m. Se conservan los problemas del modelo y se documentan las zonas no demostradas.<small>G03_conjunto_perspectiva.png · G_INTERIORES_CONECTADOS</small></figcaption></figure><figure><a href="CAPTURAS/G04_cruce_y_turbolift.png"><img loading="lazy" src="CAPTURAS/G04_cruce_y_turbolift.png"></a><figcaption><b>Cruce y transición a cabina de turbolift</b><br>Ramal aislado, corte Z=2.30 m. Solo cabina y acceso estáticos; no implementa ascensor.<small>G04_cruce_y_turbolift.png · G_INTERIORES_CONECTADOS</small></figcaption></figure></main></html>
