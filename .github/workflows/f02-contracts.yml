name: F02 — documental contract audit

on:
  pull_request:
    paths:
      - 'docs/roadmap/master/fases/F02/**'
      - 'tools/validation/validate_f02_contracts.py'
      - 'tools/validation/test_validate_f02_contracts.py'
      - '.github/workflows/f02-contracts.yml'
  push:
    branches:
      - docs/f02-core-integration-contracts
    paths:
      - 'docs/roadmap/master/fases/F02/**'
      - 'tools/validation/validate_f02_contracts.py'
      - 'tools/validation/test_validate_f02_contracts.py'
      - '.github/workflows/f02-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentary-contracts:
    name: Validate F02 documentary contracts (not Core/UE5)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify P02 / P03 / P04 traceability
        run: python tools/validation/validate_f02_contracts.py
      - name: Run hermetic validation-unit tests
        run: python -m unittest discover -s tools/validation -p 'test_validate_f02_contracts.py' -v
