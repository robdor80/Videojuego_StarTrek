name: LORE-03 B — Conflictos, guerras y crisis (documental)
on:
  push:
    branches: [main, "lore/03-b-conflicts-crises"]
    paths:
      - "mundo/lore/conflicts/**"
      - "proyecto/docs/roadmap/lore_03_b/**"
      - "desarrollo/tools/validation/*lore03_b*"
      - ".github/workflows/lore03-b-conflicts.yml"
  pull_request:
    paths:
      - "mundo/lore/conflicts/**"
      - "proyecto/docs/roadmap/lore_03_b/**"
      - "desarrollo/tools/validation/*lore03_b*"
      - ".github/workflows/lore03-b-conflicts.yml"
permissions:
  contents: read
jobs:
  documentary-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LORE-03B — reference validator and negative mutations
        run: |
          python -m py_compile desarrollo/tools/validation/validate_lore03_b.py desarrollo/tools/validation/test_lore03_b.py
          python desarrollo/tools/validation/validate_lore03_b.py
          python desarrollo/tools/validation/test_lore03_b.py
      - name: Regresiones LORE-01D y LORE-03A
        run: |
          python desarrollo/tools/validation/validate_lore01_d.py
          python desarrollo/tools/validation/test_lore01_d.py
          python desarrollo/tools/validation/validate_lore03_a.py
          python desarrollo/tools/validation/test_lore03_a.py
      - name: Regresión documental LORE-02E
        run: |
          python desarrollo/tools/validation/validate_lore02_e.py
          python desarrollo/tools/validation/test_lore02_e.py
