name: F07 procedural GLB / UV-PBR reference QA (NOT UE5)

on:
  pull_request:
    paths:
      - "desarrollo/tools/assets/f07_pbr_plate.py"
      - "desarrollo/tools/assets/f07_gltf_audit.py"
      - "desarrollo/tools/validation/test_f07_pbr_pipeline.py"
      - "proyecto/docs/roadmap/master/fases/F07/**"
      - ".github/workflows/f07-pbr-reference.yml"
  push:
    branches: [main]
    paths:
      - "desarrollo/tools/assets/f07_pbr_plate.py"
      - "desarrollo/tools/assets/f07_gltf_audit.py"
      - "desarrollo/tools/validation/test_f07_pbr_pipeline.py"
      - ".github/workflows/f07-pbr-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-pbr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m py_compile desarrollo/tools/assets/f07_pbr_plate.py desarrollo/tools/assets/f07_gltf_audit.py desarrollo/tools/validation/test_f07_pbr_pipeline.py
      - name: Verify sample material contracts and guardrails
        run: python desarrollo/tools/validation/test_f07_pbr_pipeline.py -v
      - name: Generate GLB with procedural PBR/UV (not UE5)
        run: python desarrollo/tools/assets/f07_pbr_plate.py --output /tmp/f07_armor_plate.glb --manifest /tmp/f07_armor_plate.json
      - name: Independently audit GLB structure
        run: python desarrollo/tools/assets/f07_gltf_audit.py --input /tmp/f07_armor_plate.glb --require-pbr --output /tmp/f07_glb_audit.json
