name: F05 P05A integration audit
on:
  pull_request:
    paths:
      - 'desarrollo/integration/f05/**'
      - 'desarrollo/integration/f04/**'
      - 'proyecto/docs/roadmap/master/fases/F05/**'
      - '.github/workflows/f05-native-orders.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read compatible Core pin
        id: core
        shell: pwsh
        run: |
          $sha=(Get-Content desarrollo/integration/f05/core-revision.txt -Raw).Trim()
          if($sha -notmatch '^[0-9a-f]{40}$'){throw 'Invalid Core SHA'}
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: robdor80/CoreRPG
          ref: ${{ steps.core.outputs.sha }}
          path: laboratorios/f05/p05a/ci/CoreRPG
      - name: Full compatible Core suite including JSON
        run: python desarrollo/integration/f05/run_integration_audit.py --suite core --core-source laboratorios/f05/p05a/ci/CoreRPG --output laboratorios/f05/p05a/ci/core --parallel 3
      - name: All P01-P04, P05A and F04 integration
        run: python desarrollo/integration/f05/run_integration_audit.py --suite f05 --core-source laboratorios/f05/p05a/ci/CoreRPG --output laboratorios/f05/p05a/ci/native --parallel 3
      - name: Static preparation and PowerShell syntax (not Unreal execution)
        shell: pwsh
        run: |
          python desarrollo/integration/f05/check_unreal_preparation.py
          if($LASTEXITCODE){exit $LASTEXITCODE}
          foreach($file in @('run_f05.ps1','run_p05b_msi.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "desarrollo/integration/f05/$file"),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors){$errors | Format-List;throw "PowerShell syntax: $file"}
          }
      - name: Documentation and governance
        shell: pwsh
        run: |
          python -m unittest discover -s desarrollo/tools/validation -p test_f05_reference.py -v
          if($LASTEXITCODE){exit $LASTEXITCODE}
          python desarrollo/tools/validation/f05_reference.py --fixture desarrollo/validation/fixtures/f05/order_initiative_reference_v0.1.json
          if($LASTEXITCODE){exit $LASTEXITCODE}
          python -m unittest discover -s desarrollo/tools/simulation -p test_f04_f05_f06_cross_phase.py -v
          if($LASTEXITCODE){exit $LASTEXITCODE}
          python desarrollo/tools/validation/validate_roadmap_state.py
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f05-p05a-native-${{ matrix.os }}
          path: |
            laboratorios/f05/p05a/ci/*/tests.xml
            laboratorios/f05/p05a/ci/*/run.json
            laboratorios/f05/p05a/ci/*/*.log
            laboratorios/f05/p05a/ci/*/build/Testing/Temporary/LastTest.log
            laboratorios/f05/p05a/ci/*/build/CMakeFiles/*/CMakeCXXCompiler.cmake
  earlier-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        phase: [f02, f03, f04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve original phase pin
        id: pin
        shell: pwsh
        run: |
          $sha=if('${{ matrix.phase }}' -eq 'f02'){'4f282863737bcd8f5add401202a9e1064c133672'}else{(Get-Content desarrollo/integration/${{ matrix.phase }}/core-revision.txt -Raw).Trim()}
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: robdor80/CoreRPG
          ref: ${{ steps.pin.outputs.sha }}
          path: laboratorios/f05/p05a/ci/CoreRPG
      - name: Full original native regression selection
        run: python desarrollo/integration/f05/run_integration_audit.py --suite ${{ matrix.phase }} --core-source laboratorios/f05/p05a/ci/CoreRPG --output laboratorios/f05/p05a/ci/earlier --parallel 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f05-p05a-regression-${{ matrix.phase }}-${{ matrix.os }}
          path: |
            laboratorios/f05/p05a/ci/earlier/tests.xml
            laboratorios/f05/p05a/ci/earlier/run.json
            laboratorios/f05/p05a/ci/earlier/*.log
            laboratorios/f05/p05a/ci/earlier/build/Testing/Temporary/LastTest.log
            laboratorios/f05/p05a/ci/earlier/build/CMakeFiles/*/CMakeCXXCompiler.cmake
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve historical Core pin
        id: core
        run: echo "sha=$(cat desarrollo/integration/f04/core-history-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: robdor80/CoreRPG
          ref: ${{ steps.core.outputs.sha }}
          path: laboratorios/f05/p05a/ci/CoreRPG
      - name: Six real campaigns, frozen oracles and fresh-process continuity
        run: python desarrollo/integration/f05/run_integration_audit.py --suite history --core-source laboratorios/f05/p05a/ci/CoreRPG --output laboratorios/f05/p05a/ci/history --parallel 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f05-p05a-historical
          path: |
            laboratorios/f05/p05a/ci/history/tests.xml
            laboratorios/f05/p05a/ci/history/run.json
            laboratorios/f05/p05a/ci/history/*.log
            laboratorios/f05/p05a/ci/history/build/history-runs/**/*.json
            laboratorios/f05/p05a/ci/history/build/history-runs/**/*.log
            laboratorios/f05/p05a/ci/history/build/Testing/Temporary/LastTest.log
            laboratorios/f05/p05a/ci/history/build/CMakeFiles/*/CMakeCXXCompiler.cmake
