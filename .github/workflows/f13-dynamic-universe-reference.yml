name: F13 — Universo dinámico (referencia offline; NO CoreRPG/UE5)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/f13-dynamic-universe-reference.yml"
      - "tools/validation/f13_*"
      - "tools/validation/test_f13_*"
      - "validation/fixtures/f13/**"
      - "docs/roadmap/master/fases/F13/**"
  pull_request:
    paths:
      - ".github/workflows/f13-dynamic-universe-reference.yml"
      - "tools/validation/f13_*"
      - "tools/validation/test_f13_*"
      - "validation/fixtures/f13/**"
      - "docs/roadmap/master/fases/F13/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reference:
    name: 44 escenarios + regresiones; sin autoridad Core ni runtime UE5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxis y fixture
        run: |
          python -m py_compile tools/validation/f13_dynamic_universe_reference.py tools/validation/test_f13_dynamic_universe_reference.py
          python -m json.tool validation/fixtures/f13/f13_dynamic_universe_scenarios_v0.1.json >/dev/null
      - name: Escenarios offline y huella reproducible
        run: |
          python tools/validation/f13_dynamic_universe_reference.py --scenario validation/fixtures/f13/f13_dynamic_universe_scenarios_v0.1.json --output validation/results/f13_dynamic_universe_offline_report.json
      - name: Pruebas de regresión
        run: |
          python -m unittest discover -s tools/validation -p 'test_f13_*.py' -v
      - name: Evidencia de ejecución (solo referencia)
        uses: actions/upload-artifact@v4
        with:
          name: f13-offline-reference-evidence
          path: validation/results/f13_dynamic_universe_offline_report.json
          if-no-files-found: error
          retention-days: 14
