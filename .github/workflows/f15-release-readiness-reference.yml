name: F15 — Release readiness reference (NO beta/runtime certification)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/f15-release-readiness-reference.yml"
      - "desarrollo/tools/validation/f15_*"
      - "desarrollo/validation/fixtures/f15/**"
      - "proyecto/docs/roadmap/master/fases/F15/**"
      - "proyecto/docs/roadmap/master/PLAN_MAESTRO.md"
      - "proyecto/docs/roadmap/master/ESTADO_GLOBAL.json"
      - "proyecto/docs/roadmap/master/CRITERIOS_DE_CIERRE.md"
      - "desarrollo/tools/validation/f08_acceptance_gate.py"
      - "desarrollo/tools/validation/f14_audiovisual_reference.py"
      - "proyecto/docs/decisions/prototype_validation_and_release_policy.md"
      - "audiovisual/localization/README.md"
      - "audiovisual/ui/README.md"
  pull_request:
    paths:
      - ".github/workflows/f15-release-readiness-reference.yml"
      - "desarrollo/tools/validation/f15_*"
      - "desarrollo/validation/fixtures/f15/**"
      - "proyecto/docs/roadmap/master/fases/F15/**"
      - "proyecto/docs/roadmap/master/PLAN_MAESTRO.md"
      - "proyecto/docs/roadmap/master/ESTADO_GLOBAL.json"
      - "proyecto/docs/roadmap/master/CRITERIOS_DE_CIERRE.md"
      - "desarrollo/tools/validation/f08_acceptance_gate.py"
      - "desarrollo/tools/validation/f14_audiovisual_reference.py"
      - "proyecto/docs/decisions/prototype_validation_and_release_policy.md"
      - "audiovisual/localization/README.md"
      - "audiovisual/ui/README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-release-readiness:
    name: 37 scenarios + 16 tests; reject NO_EJECUTADO template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and JSON
        run: |
          python -m py_compile desarrollo/tools/validation/f15_release_readiness.py desarrollo/tools/validation/test_f15_release_readiness.py
          python -m json.tool desarrollo/validation/fixtures/f15/f15_release_readiness_scenarios_v0.1.json >/dev/null
          python -m json.tool desarrollo/validation/fixtures/f15/f15_beta_capture_template_v0.1.json >/dev/null
      - name: Scenarios, repository audit and blocked template
        run: |
          python desarrollo/tools/validation/f15_release_readiness.py \
            --scenario desarrollo/validation/fixtures/f15/f15_release_readiness_scenarios_v0.1.json \
            --capture-template desarrollo/validation/fixtures/f15/f15_beta_capture_template_v0.1.json \
            --repo-root . \
            --output desarrollo/validation/results/f15_release_readiness_reference.json
      - name: Unit regressions
        run: python -m unittest discover -s desarrollo/tools/validation -p 'test_f15_*.py' -v
      - name: Upload reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: f15-offline-release-readiness
          path: desarrollo/validation/results/f15_release_readiness_reference.json
          if-no-files-found: error
          retention-days: 14
