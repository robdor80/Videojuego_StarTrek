name: LORE-02 E — Auditoría e integración documental A–D

on:
  pull_request:
    paths:
      - "CONTENT_STATUS.md"
      - "mundo/lore/technology/**"
      - "mundo/lore/equipment/**"
      - "mundo/lore/medicine/**"
      - "mundo/lore/science/**"
      - "proyecto/docs/decisions/lore_02_d_*"
      - "proyecto/docs/roadmap/lore_02_e_*"
      - "desarrollo/tools/validation/*lore02*"
      - ".github/workflows/lore02-e-integration.yml"
  push:
    branches: [main, "feat/lore02-e-cross-audit"]
    paths:
      - "CONTENT_STATUS.md"
      - "mundo/lore/technology/**"
      - "mundo/lore/equipment/**"
      - "mundo/lore/medicine/**"
      - "mundo/lore/science/**"
      - "proyecto/docs/decisions/lore_02_d_*"
      - "proyecto/docs/roadmap/lore_02_e_*"
      - "desarrollo/tools/validation/*lore02*"
      - ".github/workflows/lore02-e-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-domain:
    name: Referencias cruzadas y pruebas de auditoría positivas/negativas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditoría transversal A–D
        run: |
          python -m py_compile desarrollo/tools/validation/validate_lore02_e.py desarrollo/tools/validation/test_lore02_e.py
          python desarrollo/tools/validation/validate_lore02_e.py
          python desarrollo/tools/validation/test_lore02_e.py

  prior-lore:
    name: Regresión LORE-02 A–D y LORE-01 A–E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bloques A–D
        run: |
          python desarrollo/tools/validation/validate_lore02_a_completion.py
          python desarrollo/tools/validation/test_lore02_a_completion.py
          python desarrollo/tools/validation/validate_lore02_b.py
          python desarrollo/tools/validation/test_lore02_b.py
          python desarrollo/tools/validation/validate_lore02_c.py
          python desarrollo/tools/validation/test_lore02_c.py
          python desarrollo/tools/validation/validate_lore02_d.py
          python desarrollo/tools/validation/test_lore02_d.py
      - name: Base galáctica LORE-01
        run: |
          python desarrollo/tools/validation/validate_lore01_a1.py
          python desarrollo/tools/validation/test_lore01_a1.py
          python desarrollo/tools/validation/validate_lore01_b.py
          python desarrollo/tools/validation/test_lore01_b.py
          python desarrollo/tools/validation/validate_lore01_c.py
          python desarrollo/tools/validation/test_lore01_c.py
          python desarrollo/tools/validation/validate_lore01_d.py
          python desarrollo/tools/validation/test_lore01_d.py
          python desarrollo/tools/validation/validate_lore01_e.py
          python desarrollo/tools/validation/test_lore01_e.py
          python desarrollo/tools/validation/validate_roadmap_state.py

  prior-gameplay:
    name: Regresión de contratos F07–F15 (documental, no UE5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests de referencia existentes F07–F15
        run: |
          python -m unittest discover -s desarrollo/tools/validation -p 'test_f07_*.py' -v
          python -m unittest discover -s desarrollo/tools/validation -p 'test_f08_*.py' -v
          python -m unittest discover -s desarrollo/tools/validation -p 'test_f09_*.py' -v
          python -m unittest discover -s desarrollo/tools/validation -p 'test_f1*.py' -v
