name: LORE-02 D — Ciencia, investigación y fenómenos

on:
  push:
    branches: [main, "feat/lore02-d-science-phenomena"]
    paths:
      - "mundo/lore/science/**"
      - "mundo/lore/medicine/**"
      - "mundo/lore/equipment/lore02_b_*"
      - "mundo/lore/technology/lore02_a_*"
      - "CONTENT_STATUS.md"
      - "mundo/sources/source_registry/source_registry.json"
      - "proyecto/docs/roadmap/lore_02_d_*"
      - "desarrollo/tools/validation/validate_lore02_d.py"
      - "desarrollo/tools/validation/test_lore02_d.py"
      - ".github/workflows/lore02-d-science.yml"
  pull_request:
    paths:
      - "mundo/lore/science/**"
      - "mundo/lore/medicine/**"
      - "mundo/lore/equipment/lore02_b_*"
      - "mundo/lore/technology/lore02_a_*"
      - "CONTENT_STATUS.md"
      - "mundo/sources/source_registry/source_registry.json"
      - "proyecto/docs/roadmap/lore_02_d_*"
      - "desarrollo/tools/validation/validate_lore02_d.py"
      - "desarrollo/tools/validation/test_lore02_d.py"
      - ".github/workflows/lore02-d-science.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lore02-d-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate scientific authoring
        run: |
          python -m py_compile desarrollo/tools/validation/validate_lore02_d.py desarrollo/tools/validation/test_lore02_d.py
          python desarrollo/tools/validation/validate_lore02_d.py
          python desarrollo/tools/validation/test_lore02_d.py

  lore02-d-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression LORE-02 A/B/C and LORE-01 E
        run: |
          python desarrollo/tools/validation/validate_lore02_a_completion.py
          python desarrollo/tools/validation/test_lore02_a_completion.py
          python desarrollo/tools/validation/validate_lore02_b.py
          python desarrollo/tools/validation/test_lore02_b.py
          python desarrollo/tools/validation/validate_lore02_c.py
          python desarrollo/tools/validation/test_lore02_c.py
          python desarrollo/tools/validation/validate_lore01_e.py
          python desarrollo/tools/validation/test_lore01_e.py
          python desarrollo/tools/validation/validate_roadmap_state.py
