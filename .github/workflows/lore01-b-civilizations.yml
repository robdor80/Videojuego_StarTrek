name: LORE-01 B — Civilizaciones y potencias (documental)
on:
  push:
    branches: [main, "mundo/lore/01-b-civilizations-powers"]
    paths:
      - "mundo/lore/factions/**"
      - "mundo/lore/organizations/README.md"
      - "mundo/lore/federation/README.md"
      - "proyecto/docs/roadmap/lore_01_b_*"
      - "desarrollo/tools/validation/*lore01*"
      - "mundo/sources/source_registry/source_registry.json"
      - "CONTENT_STATUS.md"
      - ".github/workflows/lore01-b-civilizations.yml"
  pull_request:
    paths:
      - "mundo/lore/factions/**"
      - "mundo/lore/organizations/README.md"
      - "mundo/lore/federation/README.md"
      - "proyecto/docs/roadmap/lore_01_b_*"
      - "desarrollo/tools/validation/*lore01*"
      - "mundo/sources/source_registry/source_registry.json"
      - "CONTENT_STATUS.md"
      - ".github/workflows/lore01-b-civilizations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentary-civilizations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxis, expedientes, instituciones, cronología, IA y reserva Delta
        run: |
          python -m py_compile desarrollo/tools/validation/validate_lore01_b.py desarrollo/tools/validation/test_lore01_b.py
          python desarrollo/tools/validation/validate_lore01_b.py
          python desarrollo/tools/validation/test_lore01_b.py
      - name: Regresión LORE-01 A y A.1
        run: |
          python desarrollo/tools/validation/validate_lore01_tng.py
          python desarrollo/tools/validation/test_lore01_tng.py
          python desarrollo/tools/validation/validate_lore01_depth.py
          python desarrollo/tools/validation/test_lore01_depth.py
          python desarrollo/tools/validation/validate_lore01_a1.py
          python desarrollo/tools/validation/test_lore01_a1.py
