name: Roadmap governance — F00-F15

on:
  pull_request:
    paths:
      - "docs/roadmap/master/**"
      - "docs/decisions/prototype_validation_and_release_policy.md"
      - "tools/validation/validate_roadmap_state.py"
      - ".github/workflows/roadmap-governance.yml"
  push:
    branches: [main]
    paths:
      - "docs/roadmap/master/**"
      - "tools/validation/validate_roadmap_state.py"
      - ".github/workflows/roadmap-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roadmap-consistency:
    name: Validate roadmap JSON, plan and phase evidence (NOT runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate syntax
        run: python -m py_compile tools/validation/validate_roadmap_state.py
      - name: Verify 16 phases / 80 steps and state-plan reconciliation
        run: python tools/validation/validate_roadmap_state.py
