name: Academy Life Closure
on:
  push:
    branches: [main]
    paths:
      - 'sistemas/gameplay/careers/academy_path/**'
      - 'sistemas/gameplay/careers/service_record/**'
      - 'sistemas/gameplay/careers/post_academy/**'
      - 'sistemas/gameplay/social/**'
      - 'sistemas/gameplay/characters/wellbeing/**'
      - 'sistemas/gameplay/simulation/**'
      - 'mundo/lore/federation/starfleet/disciplinary_system/**'
      - 'desarrollo/tools/generation/*academy*.py'
      - 'desarrollo/tools/generation/*cadet*.py'
      - 'desarrollo/tools/generation/*step*.py'
      - 'desarrollo/validation/fixtures/academy_life/**'
      - 'desarrollo/validation/consistency/academy_*'
      - 'proyecto/docs/roadmap/academy_*'
      - 'proyecto/docs/roadmap/procedural_dynamic_universe_10_block_plan_v0.1.md'
      - 'CONTENT_STATUS.md'
      - '.github/workflows/academy-life-closure.yml'
  pull_request:
    paths:
      - 'sistemas/gameplay/careers/academy_path/**'
      - 'sistemas/gameplay/careers/service_record/**'
      - 'sistemas/gameplay/social/**'
      - 'sistemas/gameplay/characters/wellbeing/**'
      - 'desarrollo/tools/generation/*academy*.py'
      - 'desarrollo/tools/generation/*cadet*.py'
      - 'desarrollo/validation/fixtures/academy_life/**'
      - 'desarrollo/validation/consistency/academy_*'
      - '.github/workflows/academy-life-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academy-life:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Academy Life repository closure
        run: python desarrollo/tools/generation/validate_academy_life_final_step20.py
      - name: Run Academy Life manifest suite
        run: python desarrollo/tools/generation/run_academy_life_suite.py
