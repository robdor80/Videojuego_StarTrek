name: Academy Life Closure
on:
  push:
    branches: [main]
    paths:
      - 'gameplay/careers/academy_path/**'
      - 'gameplay/social/**'
      - 'gameplay/characters/wellbeing/**'
      - 'gameplay/simulation/**'
      - 'tools/generation/**academy**'
      - 'tools/generation/**step1*.py'
      - 'validation/fixtures/academy_life/**'
      - 'validation/consistency/academy_*'
      - '.github/workflows/academy-life-closure.yml'
  workflow_dispatch:
jobs:
  academy-life:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Academy Life reference tests
        run: |
          python tools/generation/test_validate_academy_population_step1.py
          python tools/generation/test_generate_academy_cadet_step2.py
          python tools/generation/test_generate_academy_groups_step3.py
          python tools/generation/test_generate_academy_quarters_step4.py
          python tools/generation/test_generate_academy_schedule_step5.py
          python tools/generation/test_generate_academy_free_time_step6.py
          python tools/generation/test_generate_academy_extracurricular_step7.py
          python tools/generation/test_generate_academy_academic_enrichment_step8.py
          python tools/generation/test_generate_academy_social_life_step9.py
          python tools/generation/test_resolve_academy_romance_dating_step10.py
          python tools/generation/test_resolve_academy_npc_relationships_step11.py
          python tools/generation/test_resolve_academy_mentors_instructors_step12.py
          python tools/generation/test_resolve_academy_wellbeing_step13.py
          python tools/generation/test_resolve_academy_obligations_consequences_step14.py
          python tools/generation/test_resolve_academy_campus_events_step15.py
          python tools/generation/test_resolve_academy_offscreen_step16.py
          python tools/generation/test_resolve_academy_social_lod_step17.py
          python tools/generation/test_resolve_academy_year_progression_step18.py
          python tools/generation/test_integrate_academy_record_step19.py
          python tools/generation/test_validate_academy_life_final_step20.py
