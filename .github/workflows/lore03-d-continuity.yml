name: LORE-03D — Continuidad y divergencia (documental)
on:
  push:
    branches: [main, "lore/03-d-continuity-divergence"]
    paths:
      - "proyecto/docs/roadmap/lore_03_d/**"
      - "proyecto/docs/roadmap/lore_03_master_plan_v0.1.md"
      - "CONTENT_STATUS.md"
      - "desarrollo/tools/validation/*lore03_d*"
      - ".github/workflows/lore03-d-continuity.yml"
  pull_request:
    paths:
      - "proyecto/docs/roadmap/lore_03_d/**"
      - "proyecto/docs/roadmap/lore_03_master_plan_v0.1.md"
      - "CONTENT_STATUS.md"
      - "desarrollo/tools/validation/*lore03_d*"
      - ".github/workflows/lore03-d-continuity.yml"
permissions:
  contents: read
jobs:
  documentary-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: D01-D08 validation and negative tests
        run: |
          python -m py_compile desarrollo/tools/validation/validate_lore03_d.py desarrollo/tools/validation/test_lore03_d.py
          python desarrollo/tools/validation/validate_lore03_d.py
          python desarrollo/tools/validation/test_lore03_d.py
      - name: Regression LORE-03A/B/C
        run: |
          python desarrollo/tools/validation/validate_lore03_a.py
          python desarrollo/tools/validation/test_lore03_a.py
          python desarrollo/tools/validation/validate_lore03_b.py
          python desarrollo/tools/validation/test_lore03_b.py
          python desarrollo/tools/validation/validate_lore03_c.py
          python desarrollo/tools/validation/test_lore03_c.py
      - name: Regression LORE-01D/02E
        run: |
          python desarrollo/tools/validation/validate_lore01_d.py
          python desarrollo/tools/validation/test_lore01_d.py
          python desarrollo/tools/validation/validate_lore02_e.py
          python desarrollo/tools/validation/test_lore02_e.py
