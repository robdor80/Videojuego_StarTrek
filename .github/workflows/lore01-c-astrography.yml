name: LORE-01 C — Atlas galáctico documental
on:
  push:
    branches: [main, "lore/01-c-galactic-astrography"]
    paths:
      - "lore/astrography/**"
      - "tools/validation/*lore01*"
      - "docs/roadmap/lore_01_c_*"
      - "CONTENT_STATUS.md"
      - ".github/workflows/lore01-c-astrography.yml"
  pull_request:
    paths:
      - "lore/astrography/**"
      - "tools/validation/*lore01*"
      - "docs/roadmap/lore_01_c_*"
      - "CONTENT_STATUS.md"
      - ".github/workflows/lore01-c-astrography.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentary-astrography:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar atlas, mapas, cuadrantes, rutas, derechos y DLC
        run: |
          python -m py_compile tools/validation/validate_lore01_c.py tools/validation/test_lore01_c.py
          python tools/validation/validate_lore01_c.py
          python tools/validation/test_lore01_c.py
      - name: Regresión documental LORE-01 A, A.1 y B
        run: |
          python tools/validation/validate_lore01_tng.py
          python tools/validation/test_lore01_tng.py
          python tools/validation/validate_lore01_depth.py
          python tools/validation/test_lore01_depth.py
          python tools/validation/validate_lore01_a1.py
          python tools/validation/test_lore01_a1.py
          python tools/validation/validate_lore01_b.py
          python tools/validation/test_lore01_b.py
