name: LORE-04C — Infraestructuras documentales
on:
  push:
    branches: ["docs/lore04c-infraestructuras-20261029"]
  pull_request:
    paths:
      - "proyecto/docs/roadmap/lore_04_c/**"
      - ".github/workflows/lore04-c-infrastructure.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: B/C validation plus 50 adversarial tests
        run: |
          python desarrollo/tools/validation/validate_lore04_phase.py B C
          python desarrollo/tools/validation/test_lore04_phase.py B
          python desarrollo/tools/validation/test_lore04_phase.py C
          python desarrollo/tools/validation/validate_lore04_a.py
