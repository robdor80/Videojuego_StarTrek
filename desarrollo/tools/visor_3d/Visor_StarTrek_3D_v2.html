<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RobDev · Visor 3D Star Trek</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090f19;color:#ecf2fa;font:15px system-ui,Segoe UI,sans-serif}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 22px;background:#131d2b;border-bottom:1px solid #36455a}h1{font-size:18px;margin:0}small{color:#a9b8ce}.bar{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}button,.pick{border:1px solid #45627a;border-radius:8px;background:#20344d;color:#fff;padding:10px 13px;cursor:pointer;font:inherit}button:hover,.pick:hover{background:#315473}.adjust{display:flex;align-items:center;gap:7px;font-size:12px;color:#cadcec}.adjust input{width:100px;accent-color:#9ad0ff}input[type=file]{display:none}button:disabled{opacity:.45;cursor:not-allowed}main{position:relative;height:calc(100dvh - 90px);min-height:420px;background:radial-gradient(circle,#182c3c 0%,#091018 75%);overflow:hidden}#canvas{position:absolute;inset:0}#overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:#b3c9db;font-size:18px;padding:24px}#overlay.hidden{display:none}footer{position:absolute;bottom:14px;left:20px;right:20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12px;color:#9bb4c7;pointer-events:none}#state{color:#d2e2f0}.drop{outline:3px dashed #8fbdd1;outline-offset:-12px}@media(max-width:650px){main{height:calc(100dvh - 145px)}.bar{margin-left:0}header{padding:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header><div><h1>ROBDEV · VISOR 3D v2</h1><small>Prueba local de modelos GLB · Consola de Sensores</small></div><div class="bar"><label class="pick" for="file">Abrir GLB</label><input id="file" type="file" accept=".glb,model/gltf-binary"><button id="spin" disabled>Detener giro</button><button id="reset" disabled>Reencuadrar</button><label class="adjust">Luz <input id="light" type="range" min="1" max="5" step=".25" value="3"><output id="lightout">3×</output></label><label class="adjust">Tamaño <input id="size" type="range" min=".65" max="2" step=".05" value="1.3"><output id="sizeout">1,3×</output></label></div></header>
<main id="stage"><div id="canvas"></div><div id="overlay">Pulsa «Abrir GLB» y selecciona tu Bird_of_Prey_ENT_Wholock.glb<br>También puedes arrastrar el archivo aquí.</div><footer><span id="state">Esperando modelo…</span><span>Arrastrar: rotar · Rueda: zoom · Botón derecho: desplazar</span></footer></main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const lightInput=document.querySelector("#light"),sizeInput=document.querySelector("#size"),lightOut=document.querySelector("#lightout"),sizeOut=document.querySelector("#sizeout");
const stage=document.querySelector('#stage'), canvas=document.querySelector('#canvas'), state=document.querySelector('#state'), overlay=document.querySelector('#overlay'),file=document.querySelector('#file'),spin=document.querySelector('#spin'),reset=document.querySelector('#reset');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(err){state.textContent='No se pudo iniciar WebGL: '+err.message;throw err;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=2.0;canvas.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.01,1e8),controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=.01;
const hemi=new THREE.HemisphereLight(0xffffff,0x8899ae,3.4);scene.add(hemi);
const a=new THREE.DirectionalLight(0xffffff,5);a.position.set(10,14,18);scene.add(a);
const b=new THREE.DirectionalLight(0xe5efff,4);b.position.set(-15,2,-12);scene.add(b);
const c=new THREE.DirectionalLight(0xfff0dc,3);c.position.set(5,-10,5);scene.add(c);const lights=[hemi,a,b,c];const initial=[3.4,5,4,3];
function lightChange(){const k=Number(lightInput.value)/3;lights.forEach((l,i)=>l.intensity=initial[i]*k);lightOut.textContent=lightInput.value+"×";}lightInput.addEventListener("input",lightChange);lightChange();
let model=null,radius=1,autoSpin=true,sourceURL=null;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
function frame(){requestAnimationFrame(frame);if(model&&autoSpin)model.rotation.y+=.003;controls.update();renderer.render(scene,camera)}frame();
let nominalDistance=1;
function fit(){if(!model)return;const bounds=new THREE.Box3().setFromObject(model);const s=bounds.getSize(new THREE.Vector3());radius=Math.max(s.length()/2,.001);const vFov=THREE.MathUtils.degToRad(camera.fov),hFov=2*Math.atan(Math.tan(vFov/2)*camera.aspect);nominalDistance=Math.max(s.y/(2*Math.tan(vFov/2)),s.x/(2*Math.tan(hFov/2)),s.z/(2*Math.tan(vFov/2)))*1.14;nominalDistance=Math.max(nominalDistance,radius*1.15);setSize();camera.near=Math.max(.0001,radius/1000);camera.far=Math.max(1000,radius*200);camera.updateProjectionMatrix();controls.minDistance=radius*.45;controls.maxDistance=radius*40;controls.update();}
function setSize(){if(!model)return;const d=nominalDistance/Number(sizeInput.value);controls.target.set(0,0,0);camera.position.set(d*.7,d*.38,d*.82);controls.update();sizeOut.textContent=Number(sizeInput.value).toLocaleString('es-ES')+'×';}
sizeInput.addEventListener('input',setSize);

function load(f){if(!f||!f.name.toLowerCase().endsWith('.glb')){state.textContent='Selecciona un archivo .glb';return;}overlay.classList.remove('hidden');overlay.textContent='Cargando '+f.name+'…';state.textContent='Leyendo archivo…';const url=URL.createObjectURL(f);new GLTFLoader().load(url,gltf=>{if(model){scene.remove(model);model.traverse(o=>{if(o.isMesh){o.geometry?.dispose();}});}model=new THREE.Group();const bb=new THREE.Box3().setFromObject(gltf.scene),center=bb.getCenter(new THREE.Vector3());gltf.scene.position.sub(center);model.add(gltf.scene);scene.add(model);fit();overlay.classList.add('hidden');spin.disabled=false;reset.disabled=false;autoSpin=true;spin.textContent='Detener giro';let tris=0,meshes=0;gltf.scene.traverse(o=>{if(o.isMesh){meshes++;const g=o.geometry;tris+=g.index?g.index.count/3:g.attributes.position.count/3;}});state.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MB · '+meshes+' mallas · '+Math.round(tris).toLocaleString('es-ES')+' triángulos';URL.revokeObjectURL(url);},undefined,e=>{overlay.classList.remove('hidden');overlay.textContent='No se ha podido cargar el modelo. Comprueba que sea GLB válido.';state.textContent=e.message||String(e);URL.revokeObjectURL(url);});}
file.addEventListener('change',e=>load(e.target.files[0]));spin.addEventListener('click',()=>{autoSpin=!autoSpin;spin.textContent=autoSpin?'Detener giro':'Reanudar giro'});reset.addEventListener('click',fit);
stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('drop')});stage.addEventListener('dragleave',()=>stage.classList.remove('drop'));stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('drop');load(e.dataTransfer.files[0])});
</script>
</body></html>
